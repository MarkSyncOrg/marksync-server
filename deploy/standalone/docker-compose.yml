# MarkSync server exposed directly on port 8080, kept up to date by Watchtower.
#
# First-time setup on the server (as the user that runs docker, usually root):
#   echo "$GHCR_TOKEN" | docker login ghcr.io -u <github-user> --password-stdin
#   docker compose up -d
#
# `docker login` writes the GHCR credentials to ~/.docker/config.json; Watchtower reads
# that file to pull new images of the private package. Run the login BEFORE starting the
# stack, otherwise Docker creates an empty directory at the mount path.
services:
  marksync:
    image: ghcr.io/marksyncorg/marksync-server:latest
    container_name: marksync
    restart: unless-stopped
    ports:
      - "${MARKSYNC_PORT:-8080}:8080"
    volumes:
      - marksync-data:/data
      - ./settings.json:/app/config/settings.json:ro

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Rome}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_JSON:-/root/.docker/config.json}:/config.json:ro

volumes:
  marksync-data:
