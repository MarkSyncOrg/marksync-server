name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "deploy/**"
      - ".github/workflows/docker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (SQLite)
        run: cargo test --locked
      - name: Test (MongoDB)
        run: cargo test --locked --test api
        env:
          MARKSYNC_TEST_MONGO_URI: mongodb://127.0.0.1:27017

  contract:
    # Runs the MarkSync core client's contract suite against a live server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - name: Start server
        run: |
          MARKSYNC_SETTINGS_JSON='{"db":{"path":":memory:"},"dailyNewSyncsLimit":0}' \
            ./target/debug/marksync-server &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/info && break; sleep 1; done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MarkSyncOrg/core
          path: core
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Use the pnpm version core pins in its packageManager field (pnpm 11).
          package_json_file: core/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Contract tests
        working-directory: core
        run: |
          pnpm install --frozen-lockfile
          XBS_CONTRACT_URL=http://127.0.0.1:8080 pnpm test:contract

